# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.sifakueu.test;
    return 301 https://sifakueu.test$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sifakueu.test *.sifakueu.test;
    return 301 https://$host$request_uri;
}

# Redirect legacy central subdomain to base-domain Super Admin panel
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.sifakueu.test;

    ssl_certificate     /etc/nginx/ssl/sifakueu.test.crt;
    ssl_certificate_key /etc/nginx/ssl/sifakueu.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 308 https://sifakueu.test$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;

    server_name sifakueu.test *.sifakueu.test;
    root /var/www/html/public;

    index index.php index.html;

    ssl_certificate     /etc/nginx/ssl/sifakueu.test.crt;
    ssl_certificate_key /etc/nginx/ssl/sifakueu.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
